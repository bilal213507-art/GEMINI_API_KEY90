<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilal Abid AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f4f3ff', 100: '#ebe9fe', 200: '#d9d6fe', 300: '#bdb4fe',
                            400: '#9b8afb', 500: '#7a5af8', 600: '#6938f2', 700: '#5b26df',
                            800: '#4c1fa6', 900: '#3f1b88', 950: '#260f58',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.2); border-radius: 9999px; }
        .typing-dot { animation: typingAnimation 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingAnimation {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 transition-colors duration-300 h-screen flex flex-col overflow-hidden">

    <!-- API Key Input Modal -->
    <div id="key-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full shadow-2xl space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600/20 text-brand-400 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-key"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg text-white">Gemini API Key Required</h3>
                    <p class="text-xs text-slate-400">Stored privately inside your browser only.</p>
                </div>
            </div>
            <div>
                <input id="modal-api-key" type="password" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
            </div>
            <button id="btn-save-key" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all">
                Save & Start Chatting
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="h-16 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md px-4 lg:px-6 flex items-center justify-between z-30 shrink-0">
        <div class="flex items-center gap-3">
            <button id="toggle-sidebar" class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/80 transition-all md:hidden">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="relative flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-cyan-400 p-[1px] shadow-lg">
                    <div class="w-full h-full bg-slate-950 rounded-[11px] flex items-center justify-center">
                        <i class="fa-solid fa-brain text-brand-400 text-lg"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-bold text-base md:text-lg tracking-tight flex items-center gap-2">
                        <span class="gradient-text font-extrabold">Bilal Abid AI</span>
                        <span class="px-2 py-0.5 text-[10px] uppercase font-bold rounded-full bg-brand-500/10 text-brand-400 border border-brand-500/20">Static Edition</span>
                    </h1>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
            <button id="btn-change-key" class="text-xs px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-key text-brand-400"></i>
                <span>API Key</span>
            </button>
            <button id="btn-clear-chat" title="Clear Conversation" class="p-2 sm:px-3 sm:py-1.5 rounded-xl text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 border border-transparent hover:border-slate-700 transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span class="hidden sm:inline">Reset</span>
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        <!-- Sidebar -->
        <aside id="sidebar" class="absolute md:relative z-20 inset-y-0 left-0 w-72 bg-slate-900/90 md:bg-slate-900/50 backdrop-blur-xl border-r border-slate-800/80 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
            <div class="p-4">
                <button id="btn-new-chat" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-semibold shadow-lg flex items-center justify-center gap-2.5 transition-all">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>New Conversation</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-3 space-y-6">
                <div>
                    <h2 class="px-3 text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">Features</h2>
                    <div class="space-y-1">
                        <div class="px-3 py-2 text-xs text-slate-300 flex items-center gap-2.5">
                            <i class="fa-solid fa-circle-check text-emerald-400"></i> Zero Netlify Build Failures
                        </div>
                        <div class="px-3 py-2 text-xs text-slate-300 flex items-center gap-2.5">
                            <i class="fa-solid fa-bolt text-amber-400"></i> Direct Client-to-Gemini API
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-800/80 bg-slate-900/80 text-xs text-slate-400">
                © 2026 Bilal Abid AI
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full bg-slate-950 relative overflow-hidden">
            <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 space-y-6 scroll-smooth">
                <div id="welcome-screen" class="max-w-3xl mx-auto py-8 md:py-12 flex flex-col items-center text-center space-y-8">
                    <div class="w-20 h-20 rounded-2xl bg-slate-900 flex items-center justify-center border border-slate-800 shadow-2xl">
                        <i class="fa-solid fa-sparkles text-3xl text-brand-400"></i>
                    </div>
                    <div class="space-y-3 max-w-xl">
                        <h2 class="text-2xl md:text-4xl font-extrabold tracking-tight">
                            Hello! I am <span class="gradient-text">Bilal Abid AI</span>
                        </h2>
                        <p class="text-sm md:text-base text-slate-400">
                            Ask any question and receive instant responses powered directly by Google Gemini API.
                        </p>
                    </div>
                </div>
            </div>

            <div class="p-4 md:p-6 bg-slate-950/80 border-t border-slate-800/60 backdrop-blur-md relative z-10">
                <div class="max-w-4xl mx-auto">
                    <form id="chat-form" class="relative bg-slate-900/90 border border-slate-700/80 rounded-2xl shadow-2xl">
                        <textarea 
                            id="user-input" 
                            rows="2" 
                            placeholder="Ask Bilal Abid AI anything..." 
                            class="w-full bg-transparent text-slate-100 placeholder-slate-500 px-4 py-3.5 pr-16 text-sm focus:outline-none resize-none max-h-36 overflow-y-auto"
                        ></textarea>
                        <div class="absolute right-3 bottom-3">
                            <button type="submit" id="btn-send" class="p-2.5 rounded-xl bg-brand-600 hover:bg-brand-500 text-white shadow-md transition-all">
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatBox = document.getElementById('chat-box');
            const welcomeScreen = document.getElementById('welcome-screen');
            const userInput = document.getElementById('user-input');
            const chatForm = document.getElementById('chat-form');
            const btnClear = document.getElementById('btn-clear-chat');
            const btnNewChat = document.getElementById('btn-new-chat');
            const keyModal = document.getElementById('key-modal');
            const modalApiKey = document.getElementById('modal-api-key');
            const btnSaveKey = document.getElementById('btn-save-key');
            const btnChangeKey = document.getElementById('btn-change-key');
            let isGenerating = false;

            let savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                keyModal.classList.add('hidden');
                modalApiKey.value = savedKey;
            }

            btnSaveKey.addEventListener('click', () => {
                const val = modalApiKey.value.trim();
                if (val) {
                    localStorage.setItem('gemini_api_key', val);
                    savedKey = val;
                    keyModal.classList.add('hidden');
                }
            });

            btnChangeKey.addEventListener('click', () => {
                keyModal.classList.remove('hidden');
            });

            function resetChat() {
                chatBox.innerHTML = '';
                chatBox.appendChild(welcomeScreen);
                welcomeScreen.style.display = 'flex';
            }

            btnClear?.addEventListener('click', resetChat);
            btnNewChat?.addEventListener('click', resetChat);

            userInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    chatForm.dispatchEvent(new Event('submit'));
                }
            });

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = userInput.value.trim();
                if (!text || isGenerating) return;

                if (!savedKey) {
                    keyModal.classList.remove('hidden');
                    return;
                }

                if (welcomeScreen) welcomeScreen.style.display = 'none';

                appendMessage('user', text);
                userInput.value = '';
                generateAIResponse(text);
            });

            async function generateAIResponse(promptText) {
                isGenerating = true;
                appendTypingIndicator();

                try {
                    // Using current active model gemini-1.5-flash
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${savedKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: promptText }] }],
                            systemInstruction: {
                                parts: [{ text: "You are Bilal Abid AI. Answer all user questions directly, accurately, and concisely without preambles, greetings, or saying 'thank you'." }]
                            }
                        })
                    });

                    const data = await response.json();
                    removeTypingIndicator();

                    if (data.candidates && data.candidates[0].content.parts[0].text) {
                        appendMessage('ai', data.candidates[0].content.parts[0].text);
                    } else if (data.error) {
                        appendMessage('ai', 'API Error: ' + data.error.message);
                    } else {
                        appendMessage('ai', 'Failed to parse AI response.');
                    }
                } catch (err) {
                    removeTypingIndicator();
                    appendMessage('ai', 'Network Error: Unable to reach Gemini API.');
                } finally {
                    isGenerating = false;
                }
            }

            function appendMessage(sender, text) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex gap-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

                if (sender === 'user') {
                    messageDiv.innerHTML = `
                        <div class="max-w-[80%] rounded-2xl bg-brand-600 text-white px-4 py-3 text-sm">
                            ${escapeHtml(text)}
                        </div>`;
                } else {
                    messageDiv.innerHTML = `
                        <div class="max-w-[80%] rounded-2xl bg-slate-900 border border-slate-800 text-slate-200 px-5 py-4 text-sm leading-relaxed whitespace-pre-wrap">
                            <div class="font-bold text-xs text-brand-400 mb-2">Bilal Abid AI</div>
                            ${escapeHtml(text)}
                        </div>`;
                }

                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function appendTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.id = 'typing-indicator';
                typingDiv.className = 'flex gap-2 p-3 bg-slate-900 border border-slate-800 rounded-2xl w-24';
                typingDiv.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-brand-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-brand-400 typing-dot"></span>
                    <span class="w-2 h-2 rounded-full bg-brand-400 typing-dot"></span>`;
                chatBox.appendChild(typingDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            function removeTypingIndicator() {
                const typingDiv = document.getElementById('typing-indicator');
                if (typingDiv) typingDiv.remove();
            }

            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            }
        });
    </script>
</body>
</html>
